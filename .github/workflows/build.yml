name: build Claude runtime image

on:
  push:
    branches: ["devin/**"]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/captive-path/paperclip-claude-runtime:paperclip-2026.916.1-claude-2.1.283-${{ github.sha }}
      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/captive-path/paperclip-claude-runtime
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
